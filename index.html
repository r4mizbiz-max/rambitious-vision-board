<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Rambitious Vision Board</title>
  <meta name="description" content="Infinite canvas vision board · Stage 2 → Stage 3 · 60-day sprint" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-0: #07070b;
      --bg-1: #0e0e15;
      --bg-2: #15151e;
      --bg-3: #1c1c28;
      --line: #2a2a3a;
      --text: #e8e8ea;
      --text-dim: #9999a8;
      --text-faint: #5a5a6a;
      --p-1: #a855f7;
      --p-2: #ec4899;
      --p-3: #fb7185;
      --p-4: #f97316;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-0);
      color: var(--text);
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow: hidden;
      letter-spacing: -0.01em;
    }
    .syne { font-family: 'Syne', 'DM Sans', sans-serif; letter-spacing: -0.02em; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .gradient-text {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #fb7185 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    /* Dot grid background */
    .canvas-viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      background-color: var(--bg-0);
      background-image: radial-gradient(circle, rgba(168, 85, 247, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
    }
    .canvas-viewport.dragging { cursor: grabbing; }
    .canvas-world {
      position: absolute;
      top: 0; left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.25;
      pointer-events: none;
    }
    .edges-svg {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      overflow: visible;
    }
    .edge {
      fill: none;
      stroke: rgba(168, 85, 247, 0.4);
      stroke-width: 2;
    }
    .edge-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      fill: var(--text-faint);
    }
    .card {
      position: absolute;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 4px 20px -4px rgba(0, 0, 0, 0.5);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      overflow: hidden;
      cursor: pointer;
    }
    .card:hover {
      border-color: rgba(168, 85, 247, 0.5);
      box-shadow: 0 8px 40px -8px rgba(168, 85, 247, 0.3);
      transform: translateY(-2px);
      z-index: 10;
    }
    .card-content { font-size: 13px; line-height: 1.55; color: var(--text); }
    .card-content h1 { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; margin-bottom: 6px; line-height: 1.05; }
    .card-content h2 { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; margin-bottom: 8px; line-height: 1.1; }
    .card-content h3 { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 6px; line-height: 1.15; }
    .card-content p { margin-bottom: 8px; color: var(--text-dim); }
    .card-content ul, .card-content ol { padding-left: 18px; margin-bottom: 6px; }
    .card-content li { margin-bottom: 4px; color: var(--text-dim); font-size: 12.5px; }
    .card-content strong { color: var(--text); font-weight: 600; }
    .card-content em { font-style: italic; }
    .card-content blockquote {
      border-left: 3px solid var(--p-2);
      padding: 4px 12px;
      margin: 6px 0;
      color: var(--text-dim);
      font-style: italic;
      font-size: 13px;
    }
    .card-content code { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--bg-1); padding: 1px 5px; border-radius: 3px; color: var(--p-2); }
    .card-content .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.1em; }
    .card-content .gradient-text {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 50%, #fb7185 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .card.color-1 { border-color: rgba(248, 113, 113, 0.4); background: linear-gradient(135deg, rgba(248, 113, 113, 0.06) 0%, var(--bg-2) 100%); }
    .card.color-2 { border-color: rgba(251, 146, 60, 0.4); background: linear-gradient(135deg, rgba(251, 146, 60, 0.06) 0%, var(--bg-2) 100%); }
    .card.color-3 { border-color: rgba(251, 191, 36, 0.4); background: linear-gradient(135deg, rgba(251, 191, 36, 0.06) 0%, var(--bg-2) 100%); }
    .card.color-4 { border-color: rgba(52, 211, 153, 0.4); background: linear-gradient(135deg, rgba(52, 211, 153, 0.06) 0%, var(--bg-2) 100%); }
    .card.color-5 { border-color: rgba(34, 211, 238, 0.4); background: linear-gradient(135deg, rgba(34, 211, 238, 0.06) 0%, var(--bg-2) 100%); }
    .card.color-6 { border-color: rgba(168, 85, 247, 0.5); background: linear-gradient(135deg, rgba(168, 85, 247, 0.08) 0%, var(--bg-2) 100%); box-shadow: 0 0 30px -10px rgba(168, 85, 247, 0.3); }
    .card.current { animation: pulse-glow 3s ease-in-out infinite; }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px -10px rgba(236, 72, 153, 0.4); }
      50% { box-shadow: 0 0 50px -5px rgba(236, 72, 153, 0.7); }
    }
    /* Top bar */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 14px 20px;
      backdrop-filter: blur(16px);
      background: rgba(7, 7, 11, 0.6);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar-title { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; }
    .topbar-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
    .topbar-btns { display: flex; gap: 8px; }
    .btn {
      background: var(--bg-2);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover { border-color: rgba(168, 85, 247, 0.5); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--p-1) 0%, var(--p-2) 100%);
      border: none;
    }
    /* Zoom controls */
    .zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: rgba(7, 7, 11, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
    }
    .zoom-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
      transition: background 0.15s ease;
    }
    .zoom-btn:hover { background: rgba(168, 85, 247, 0.15); }
    .zoom-level {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      padding: 4px 0;
    }
    /* Minimap */
    .minimap {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      width: 200px;
      height: 130px;
      background: rgba(7, 7, 11, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }
    .minimap-canvas {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .minimap-node {
      position: absolute;
      border-radius: 1px;
    }
    .minimap-viewport {
      position: absolute;
      border: 1.5px solid var(--p-2);
      border-radius: 3px;
      background: rgba(236, 72, 153, 0.15);
      pointer-events: none;
    }
    /* Welcome modal */
    .welcome {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(7, 7, 11, 0.9);
      backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeIn 0.4s ease;
    }
    .welcome.hidden { display: none; }
    .welcome-card {
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px;
      max-width: 480px;
      text-align: center;
    }
    .welcome-card h1 { font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800; margin-bottom: 12px; }
    .welcome-card p { color: var(--text-dim); margin-bottom: 24px; font-size: 14px; line-height: 1.6; }
    .welcome-card .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .control-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-dim); }
    .key { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: var(--bg-3); border: 1px solid var(--line); padding: 3px 8px; border-radius: 4px; color: var(--text); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    /* Section labels (floating annotations) */
    .section-label {
      position: absolute;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--p-2);
      pointer-events: none;
      opacity: 0.6;
    }
    @media (max-width: 768px) {
      .topbar-meta { display: none; }
      .minimap { display: none; }
    }
  </style>
</head>

          mn.style.width = (n.w * ratio) + 'px';
          mn.style.height = (n.h * ratio) + 'px';
          const colors = { 1: '#f87171', 2: '#fb923c', 3: '#fbbf24', 4: '#34d399', 5: '#22d3ee', 6: '#a855f7' };
          mn.style.background = n.color ? colors[n.color] : 'rgba(168, 85, 247, 0.4)';
          mn.style.opacity = '0.6';
          minimap.insertBefore(mn, minimapViewport);
        });
        minimap.dataset.rendered = '1';
      }

      // viewport rect
      const vp = viewport.getBoundingClientRect();
      const visX = (-worldX) / scale;
      const visY = (-worldY) / scale;
      const visW = vp.width / scale;
      const visH = vp.height / scale;
      minimapViewport.style.left = ((visX - minX) * ratio) + 'px';
      minimapViewport.style.top = ((visY - minY) * ratio) + 'px';
      minimapViewport.style.width = (visW * ratio) + 'px';
      minimapViewport.style.height = (visH * ratio) + 'px';
    }

    minimap.parentElement.addEventListener('click', (e) => {
      const rect = minimap.parentElement.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      NODES.forEach(n => {
        minX = Math.min(minX, n.x);
        minY = Math.min(minY, n.y);
        maxX = Math.max(maxX, n.x + n.w);
        maxY = Math.max(maxY, n.y + n.h);
      });
      const cW = maxX - minX, cH = maxY - minY;
      const ratio = Math.min(200 / cW, 130 / cH);
      const tx = (mx / ratio) + minX;
      const ty = (my / ratio) + minY;
      const vp = viewport.getBoundingClientRect();
      worldX = vp.width / 2 - tx * scale;
      worldY = vp.height / 2 - ty * scale;
      applyTransform();
    });

    // === Keyboard ===
    window.addEventListener('keydown', (e) => {
      if (e.key === 'f' || e.key === 'F') { fitToScreen(); }
      if (e.key === '0') { scale = 1; applyTransform(); }
    });

    // === Welcome modal ===
    function closeWelcome() {
      document.getElementById('welcome').classList.add('hidden');
      setTimeout(fitToScreen, 100);
    }

    // === Day counter ===
    const today = new Date();
    const sprintStart = new Date('2026-05-13T00:00:00');
    const dayNum = Math.max(1, Math.min(60, Math.floor((today - sprintStart) / (1000 * 60 * 60 * 24)) + 1));
    document.getElementById('day-counter').textContent = dayNum;

    // === Init ===
    fitToScreen();
    window.addEventListener('resize', fitToScreen);
  </script>
</body>
</html>
